security:
    providers:
        users_in_memory: { memory: null }
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        health:
            pattern: ^/health$
            security: false
        main:
            pattern: ^/
            stateless: true
            custom_authenticator: App\Security\ApiKeyAuthenticator

    access_control:
        - { path: ^/health$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }