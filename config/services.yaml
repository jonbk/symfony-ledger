parameters:
  ledger.apiKey: '%env(base64:LEDGER_API_KEY)%'
  ledger.privateKey: '%env(base64:LEDGER_SIGNATURE_PRIVATE_KEY)%'
  ledger.publicKey: '%env(base64:LEDGER_SIGNATURE_PUBLIC_KEY)%'

services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Kernel.php'

  App\Security\ApiKeyAuthenticator:
    arguments:
      $apiKey: '%ledger.apiKey%'

  # Verrou advisory PostgreSQL : partagé entre toutes les instances de l'application
  app.ledger_lock.store:
    class: Symfony\Component\Lock\Store\DoctrineDbalPostgreSqlStore
    arguments: ['@doctrine.dbal.default_connection']

  app.ledger_lock.factory:
    class: Symfony\Component\Lock\LockFactory
    arguments: ['@app.ledger_lock.store']

  App\Service\Blockchain:
    arguments:
      $lockFactory: '@app.ledger_lock.factory'
      $privateKey: '%ledger.privateKey%'
      $publicKey: '%ledger.publicKey%'