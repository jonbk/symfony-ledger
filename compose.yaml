services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    volumes:
      - .:/var/www/html
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.ledger.rule=Host(`ledger.cyberautopieces.test`)"
      - "traefik.http.routers.ledger.entrypoints=websecure"
      - "traefik.http.routers.ledger.tls=true"
      - "traefik.http.services.ledger.loadbalancer.server.port=8080"
    networks:
      - traefik
      - default

  db:
    image: postgres:18
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_USER: ledger

networks:
  traefik:
    external: true
